<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartik Somani Resume</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07110b;color:#f4fff7}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:#0d1a12;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0}.actions{display:flex;gap:10px}.btn{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#f4fff7;text-decoration:none;background:rgba(255,255,255,.04);cursor:pointer}.primary{background:#a6ff4d;color:#06100a;border:0;font-weight:800}#viewer{width:100%;height:calc(100vh - 67px);border:0;background:#fff}.msg{padding:28px;color:#c9dbcf}</style></head><body><div class="bar"><strong>Kartik Somani - Resume</strong><div class="actions"><a class="btn" href="/">Back to portfolio</a><button class="btn primary" id="download" disabled>Download PDF</button></div></div><div id="status" class="msg">Loading resume...</div><iframe id="viewer" hidden title="Kartik Somani Resume"></iframe><script>(async()=>{const status=document.getElementById('status'),viewer=document.getElementById('viewer'),download=document.getElementById('download');try{const r=await fetch('https://raw.githubusercontent.com/ktsomani/user-funnel-analysis/main/resume/Kartik_Somani_Data_Product_GTM_Resume.pdf',{cache:'no-store'});if(!r.ok)throw new Error('Resume file unavailable');const text=(await r.text()).replace(/\s+/g,'');const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);viewer.src=url;viewer.hidden=false;status.remove();download.disabled=false;download.onclick=()=>{const a=document.createElement('a');a.href=url;a.download='Kartik_Somani_Data_Product_GTM_Resume.pdf';document.body.appendChild(a);a.click();a.remove();};}catch(e){status.textContent='Resume could not load. Please use the GitHub source link or contact kartik.somani500@gmail.com.';}})();</script></body></html>
